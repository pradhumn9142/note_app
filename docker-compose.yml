services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: note_app_production
      MYSQL_USER: note_user
      MYSQL_PASSWORD: notepassword
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: always
    environment:
      RAILS_ENV: production
      DATABASE_URL: mysql2://note_user:notepassword@db:3306/note_app_production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
    ports:
      - "3000:80" # Maps localhost:3000 on your machine to port 80 (Thruster) in the container
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: